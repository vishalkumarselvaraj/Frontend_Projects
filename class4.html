<html lang="en">
  <head>

    <title>Form</title>

  <body>
    <center>
      <h1>
        <i><b>Student Information</b></i>

      <fieldset>

        </br>

      </br>

      </fieldset>
      <br>
      </br>

      </br>

       <br>
      </br>

          <br>
      </br>

      <br>
      </br>

      <br>
      </br>

      <br>
      </br>
      <center>
        <input type="reset">

      </center>
    </form>
