<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstarp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col">
          <div
            class="card"
            style="
              background-color: rgb(206, 162, 162);
              height: 450px;
              width: 350px;
              border-radius: 50px;
            "
          >
            <img
              src="96.jpg"
              class="card-img-top"
              alt="Wrong"
              height="320px"
              width="200"
            />
            <div class="card-body">
              <h2 class="card-title text-center">96</h2>
              <p class="card-text text-center fs-6">CBFC: U 2018</p>
              <p class="card-text text-center fs-6">Romance/Drama ‧ 2h 38m</p>
            </div>
          </div>
        </div>
        <div class="col">
          <div
            class="card"
            style="
              background-color: rgb(145, 189, 189);
              height: 450px;
              width: 350px;
            "
          >
            <img
              src="ms untold.jpg"
              class="class-card-img-top"
              height="348px"
              width="348"
            />
            <div card-body>
              <h2 class="card-title text-center fs-4">
                M.S. Dhoni: The Untold Story
              </h2>
              <p class="card-text text-center fs-6">CBFC: U 2016</p>
              <p class="card-text text-center fs-6">Sport/Drama ‧ 3h 10m</p>
            </div>
          </div>
        </div>
        <div class="col">
          <div
            class="card"
            style="
              background-color: rgb(212, 161, 162);
              height: 450px;
              width: 350px;
            "
          >
            <img
              src="meiyazhagan.jpg"
              class="class-card-img-top"
              height="348px"
              width="348"
            />
            <div card-body>
              <h2 class="card-title text-center fs-4">Meiyazhagan</h2>
              <p class="card-text text-center fs-6">CBFC: U 2024</p>
              <p class="card-text text-center fs-6">Feel Good ‧ 2h 58m</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
