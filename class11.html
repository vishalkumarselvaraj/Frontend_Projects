<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Structure</title>
    <link rel="stylesheet" href="class11.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>My Dashboard</h1>
      </header>
      <aside>
        <h2>Sidebar</h2>
        <p>🏠Home</p>
        <p>📊Dashboard</p>

        <p>⚙️Settings</p>
      </aside>
      <main>
        <section class="banner">
          <h2>BANNER</h2>
        </section>
        <section>
          <div class="box card1">
            <p>CARD 1</p>
          </div>
          <div class="box card2">
            <p>CARD 2</p>
          </div>
          <div class="box card3">
            <p>CARD 3</p>
          </div>
          <div class="box card4">
            <p>CARD 4</p>
          </div>
        </section>
      </main>
      <footer>
        <h2>Footer</h2>
      </footer>
    </div>
  </body>
</html>
