<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="cal.css" />
  </head>
  <body>
    <div class="all">
      <div class="first">
        <h2>Calculator</h2>
      </div>
      <div class="second">
        <input type="number" placeholder="0" />
      </div>
      <div class="sym">
        <div class="id1">
          <h2>%</h2>
        </div>
        <div class="id2">
          <h2>CE</h2>
        </div>
        <div class="id3">
          <h2>C</h2>
        </div>
        <div class="id4">
          <img src="backspace.jpg" alt="Wrong" />
        </div>
      </div>
      <div class="num">
        <div class="id5">
          <h2>7</h2>
        </div>
        <div class="id6">
          <h2>8</h2>
        </div>
        <div class="id7">
          <h2>9</h2>
        </div>
        <div class="id8">
          <h2>X</h2>
        </div>
      </div>
      <div class="num1">
        <div class="id9">
          <h2>4</h2>
        </div>
        <div class="id10">
          <h2>5</h2>
        </div>
        <div class="id11">
          <h2>6</h2>
        </div>
        <div class="id12">
          <h2>-</h2>
        </div>
      </div>
      <div class="num2">
        <div class="id13">
          <h2>1</h2>
        </div>
        <div class="id14">
          <h2>2</h2>
        </div>
        <div class="id15">
          <h2>3</h2>
        </div>
        <div class="id16">
          <h2>+</h2>
        </div>
      </div>
      <div class="num3">
        <div class="id17">
          <h2>/</h2>
        </div>
        <div class="id18">
          <h2>0</h2>
        </div>
        <div class="id19">
          <h2>.</h2>
        </div>
        <div class="id20">
          <h2>=</h2>
        </div>
      </div>
    </div>
  </body>
</html>
