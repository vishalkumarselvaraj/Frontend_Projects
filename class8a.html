<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Src</title>
    <link rel="stylesheet" href="class8a.css" />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <h1>Google Map</h1>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31410.726072364574!2d77.47093385510944!3d10.234076802532329!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b0766637f0a0387%3A0x9ffae9373758c13c!2sKodaikanal%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1786545364537!5m2!1sen!2sin"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <div class="box">
        <h1>Video</h1>
        <video controls>
          <source src="video.mp4" type="video/mp4" />
        </video>
      </div>
      <div class="box">
        <h1>Audio</h1>
        <audio controls>
          <source src="audio.mp3" type="audio/mp3" />
        </audio>
      </div>
      <div class="box">
        <h1>Link</h1>
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/vdGWoAKof_Q?si=2dvE01iE3DVV4GnM"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </body>
</html>
